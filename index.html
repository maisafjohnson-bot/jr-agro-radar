<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JR Agro Radar</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --musgo:#3F5A2E; --musgo-2:#56763F; --tinta:#1E2A17; --gelo:#F3F5F2; --papel:#FFFFFF;
  --cinza:#666C63; --linha:#D8DDD3; --laranja:#D9701A; --laranja-fundo:#FBEBDD;
  --bom:#3F7A2E; --ruim:#B5462A; --neutro:#8A8F86;
  --sombra:0 1px 0 var(--linha);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --musgo:#8DB36F; --musgo-2:#6F9655; --tinta:#E8EDE3; --gelo:#141A11; --papel:#1C2418;
  --cinza:#A2A99D; --linha:#2F3A29; --laranja:#F0913F; --laranja-fundo:#3A2513;
  --bom:#8DB36F; --ruim:#E3826A; --neutro:#8A8F86;}}
:root[data-theme="dark"]{--musgo:#8DB36F; --musgo-2:#6F9655; --tinta:#E8EDE3; --gelo:#141A11; --papel:#1C2418; --cinza:#A2A99D; --linha:#2F3A29; --laranja:#F0913F; --laranja-fundo:#3A2513; --bom:#8DB36F; --ruim:#E3826A;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--gelo);color:var(--tinta);font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--musgo)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.topo{position:sticky;top:0;z-index:5;background:var(--gelo);border-bottom:1px solid var(--linha);padding:10px 16px;display:flex;align-items:center;gap:10px}
.marca{font-weight:800;font-stretch:115%;letter-spacing:-.01em;font-size:17px}
.marca span{color:var(--musgo)}
.frescor{margin-left:auto;font-size:13px;color:var(--cinza);display:flex;align-items:center;gap:6px;text-align:right}
.ponto{width:8px;height:8px;border-radius:50%;background:var(--neutro);flex:none}
.ponto.ok{background:var(--bom)} .ponto.falha{background:var(--laranja)}
main{max-width:980px;margin:0 auto;padding:0 16px}
section.tela{display:none} section.tela.ativa{display:block}
h2{font-size:20px;font-weight:750;font-stretch:105%;margin:28px 0 10px;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700;margin:18px 0 6px}
p{margin:0 0 10px;max-width:72ch}
.mudo{color:var(--cinza);font-size:14px}

/* Veredito — o elemento memorável */
.veredito{margin:16px -16px 0;padding:22px 16px 18px;background:var(--musgo);color:#F4F7F1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .veredito{background:#24331B}}
.veredito .rec{font-weight:800;font-stretch:122%;font-size:clamp(24px,6.4vw,40px);line-height:1.04;letter-spacing:-.015em;margin:4px 0 14px;text-wrap:balance}
.veredito .linha1{font-size:14px;opacity:.85}
.termo{position:relative;height:46px;margin:6px 0 4px}
.termo .faixas{position:absolute;left:0;right:0;bottom:0;display:flex;height:10px;border-radius:5px;overflow:hidden}
.termo .faixas i{flex:1;opacity:.9}
.termo .marcador{position:absolute;top:0;z-index:1;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.termo .marcador b{font-size:13px;background:#F4F7F1;color:#1E2A17;border-radius:4px;padding:0 6px;font-weight:800}
.termo .marcador::after{content:"";width:3px;height:22px;background:#F4F7F1;border-radius:2px}
.termo-escala{display:flex;justify-content:space-between;font-size:11px;opacity:.75}
.veredito .resumo{font-size:15px;margin-top:12px;max-width:68ch}
.veredito .semnota{font-size:15px;opacity:.9;border-left:3px solid var(--laranja);padding-left:10px;margin:8px 0}

.fatores{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.fatores{grid-template-columns:1fr 1fr}}
.fator{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:12px 14px}
.fator .t{font-weight:700;display:flex;gap:8px;align-items:baseline}
.fator .t .s{font-weight:800}
.s.pos{color:var(--bom)} .s.neg{color:var(--ruim)}
.fator details{margin-top:6px;font-size:14px}
.fator summary{cursor:pointer;color:var(--musgo);font-weight:600}
.lista-fatores{list-style:none;padding:0;margin:0}
.lista-fatores li{padding:8px 0;border-top:1px solid var(--linha);font-size:15px}
.lista-fatores li:first-child{border-top:0}

.acao{border-left:4px solid var(--musgo);background:var(--papel);padding:12px 14px;margin:10px 0;border-radius:0 10px 10px 0}
.acao.dep{border-left-color:var(--laranja)}
.acao h3{margin:0 0 4px;font-size:16px}
.acao .meta{font-size:13px;color:var(--cinza);margin-bottom:6px}
.acao dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;margin:6px 0 0}
.acao dt{color:var(--cinza)} .acao dd{margin:0}

.msg{background:var(--papel);border:1px solid var(--linha);border-radius:12px 12px 12px 2px;padding:12px 14px;margin:8px 0;white-space:pre-wrap;font-size:15px}
.msg-cab{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.btn{border:1px solid var(--musgo);background:transparent;color:var(--musgo);border-radius:8px;padding:6px 12px;font-weight:650;cursor:pointer;font-size:14px}
.btn.cheio{background:var(--musgo);color:var(--gelo)}
.btn:disabled{opacity:.5}
.alerta{background:var(--laranja-fundo);border-left:4px solid var(--laranja);padding:10px 12px;margin:8px 0;border-radius:0 8px 8px 0;font-size:15px}
.alerta b{display:block}

.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--linha);background:var(--papel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--musgo);color:var(--gelo);border-color:var(--musgo)}

.ind{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:12px 14px;margin:10px 0}
.ind .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ind .nome{font-weight:700;font-size:15px}
.ind .val{font-size:26px;font-weight:800;font-stretch:110%;line-height:1.1;margin-top:4px}
.ind .un{font-size:14px;font-weight:500;color:var(--cinza)}
.ind .vars{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:6px 0}
.ind .vars span b{font-weight:700}
.ind .rodape{font-size:12.5px;color:var(--cinza)}
.etq{font-size:12px;border-radius:4px;padding:1px 6px;border:1px solid var(--linha);white-space:nowrap}
.etq.atual{color:var(--bom);border-color:currentColor}
.etq.desatualizado,.etq.ausente{color:var(--laranja);border-color:currentColor}
.ind.vazio{border-style:dashed}
.ind svg{display:block}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--linha);vertical-align:top}
th{font-weight:650;color:var(--cinza)}
.rolagem{overflow-x:auto}

.barra-bloco{display:grid;grid-template-columns:minmax(120px,38%) 1fr 54px;gap:8px;align-items:center;font-size:14px;padding:6px 0}
.trilho{position:relative;height:12px;background:var(--linha);border-radius:3px}
.trilho .meio{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--cinza)}
.trilho i{position:absolute;top:0;bottom:0;border-radius:3px}

.grafico{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:10px}
select,input[type=file]{font:inherit;font-size:15px;padding:6px;border:1px solid var(--linha);border-radius:8px;background:var(--papel);color:var(--tinta);max-width:100%}

.md h1{font-size:20px} .md h2{font-size:17px;margin-top:20px} .md blockquote{margin:6px 0;padding:8px 12px;background:var(--papel);border-left:3px solid var(--musgo)}
.md li{margin:4px 0}

nav.abas{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--papel);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom)}
nav.abas button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:12.5px;color:var(--cinza);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.abas button svg{width:22px;height:22px}
nav.abas button[aria-current="page"]{color:var(--musgo);font-weight:700}
@media(min-width:900px){
  body{padding-bottom:0}
  nav.abas{position:sticky;top:49px;border:0;border-bottom:1px solid var(--linha);background:var(--gelo);justify-content:center;gap:4px}
  nav.abas button{flex:none;flex-direction:row;padding:10px 14px;font-size:14px}
  nav.abas button svg{width:18px;height:18px}
  .veredito{margin:16px 0 0;border-radius:14px;padding:26px 28px}
}
.sub{display:flex;gap:6px;overflow-x:auto;margin:14px 0 4px;padding-bottom:4px}
.vazio-geral{padding:40px 0}
@media (prefers-reduced-motion:no-preference){.termo .marcador{transition:left .6s cubic-bezier(.2,.8,.2,1)}}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">JR Agro <span>Radar</span></div>
  <div class="frescor" id="frescor"><span class="ponto"></span><span>Carregando…</span></div>
</header>

<nav class="abas" aria-label="Seções">
  <button data-tela="hoje" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoje</button>
  <button data-tela="marcas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Marcas</button>
  <button data-tela="catalogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>Catálogo</button>
  <button data-tela="crm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.9 2.6 2.6 3 5.2"/></svg>CRM</button>
  <button data-tela="mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mais</button>
</nav>

<main>
  <section class="tela ativa" id="hoje" aria-live="polite"></section>
  <section class="tela" id="marcas"></section>
  <section class="tela" id="catalogo"></section>
  <section class="tela" id="crm"></section>
  <section class="tela" id="mais"></section>
  <section class="tela" id="mercado"></section>
  <section class="tela" id="plano"></section>
  <section class="tela" id="historico"></section>
  <section class="tela" id="regional"></section>
</main>

<script type="module">
import { search, duplicates, outdated, compareProducts, compareVariants, fitByPower, mergeOverrides, norm } from './src/lib/catalogo.js';
import { createCRM, staleNegotiations, crmEvidence, salesSeasonality, pipeline, ETAPAS, ABERTAS, PERFIS, CAMPOS_CSV } from './src/lib/crm.js';
import { combine, COMPONENTES } from './src/engine/brands.js';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, c = 2) => (v == null || !isFinite(v)) ? '—' : v.toLocaleString('pt-BR', {minimumFractionDigits: c, maximumFractionDigits: c});
const pct = v => (v == null || !isFinite(v)) ? '—' : Math.abs(v) < 0.05 ? '0,0%' : `${v > 0 ? '+' : ''}${num(v, 1)}%`;
const dataBR = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '—';
const dataHora = iso => iso ? new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '—';
const casas = u => /índice/.test(u||'') ? 1 : 2;
const store = {
  get(k, d) { try { const v = localStorage.getItem('radar.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('radar.' + k, JSON.stringify(v)); return true; } catch { return false; } }
};
// Os dados vêm sempre do mesmo endereço do painel (auditoria: removida a opção ?dados=, que permitia
// abrir o painel com dados de outro site).
const url = p => p;
async function getJSON(p) { const r = await fetch(url(p), {cache:'no-cache'}); if (!r.ok) throw new Error(`${p}: HTTP ${r.status}`); return r.json(); }
async function getText(p) { const r = await fetch(url(p), {cache:'no-cache'}); if (!r.ok) throw new Error(`${p}: HTTP ${r.status}`); return r.text(); }

let D = null, CAT = null, ALERTS_CFG = null, HIST = [];
let CATBASE = null, PRODUTOS = [], POT = null, GEO = [], crm = null;
const lsAdapter = { getItem: k => { try { return localStorage.getItem(k); } catch { return null; } }, setItem: (k, v) => { localStorage.setItem(k, v); } };
const SECAO_MAIS = ['mercado', 'plano', 'historico', 'regional'];

// ---------- navegação ----------
document.querySelectorAll('nav.abas button').forEach(b => b.addEventListener('click', () => ir(b.dataset.tela)));
// Links e atalhos com #tela (ex.: favoritos no celular) também trocam de tela.
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (t && document.getElementById(t)?.classList.contains('tela') && !document.getElementById(t).classList.contains('ativa')) ir(t); });
function ir(t) {
  document.querySelectorAll('section.tela').forEach(s => s.classList.toggle('ativa', s.id === t));
  const nav = SECAO_MAIS.includes(t) ? 'mais' : t;
  document.querySelectorAll('nav.abas button').forEach(b => b.dataset.tela === nav ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  try { history.replaceState(null, '', '#' + t); } catch {}
  window.scrollTo(0, 0);
  if (t === 'historico') renderHistorico();
  if (t === 'regional') renderRegional();
}

// ---------- carregamento ----------
async function carregar() {
  // Catálogo e CRM funcionam mesmo sem análise publicada.
  try { CATBASE = await getJSON('data/catalogo/produtos.json'); } catch { CATBASE = null; }
  PRODUTOS = CATBASE ? mergeOverrides(CATBASE.produtos, store.get('catalogo.overrides', {})) : [];
  crm = createCRM(lsAdapter, { catalogo: PRODUTOS });
  renderCatalogo(); renderCRM();
  try { CAT = await getJSON('config/catalog.json'); } catch {}
  try { ALERTS_CFG = await getJSON('config/alerts.json'); } catch {}
  try { D = await getJSON('data/latest.json'); }
  catch (e) { semDados(e); const h0 = location.hash.slice(1); if (h0 && document.getElementById(h0)) ir(h0); return; }
  try { HIST = (await getText('data/history/diagnosticos.jsonl')).split('\n').filter(Boolean).map(l => JSON.parse(l)); } catch { HIST = []; }
  renderFrescor(); renderHoje(); renderMarcas(); renderMercado(); renderPlano(); renderMais();
  const h = location.hash.slice(1); if (h && document.getElementById(h)) ir(h);
}
function semDados(e) {
  $('#frescor').innerHTML = '<span class="ponto falha"></span><span>Sem análise</span>';
  const vazio = `<div class="vazio-geral"><h2>Ainda não há análise publicada</h2>
  <p>O painel lê o arquivo <code>data/latest.json</code>, gerado pela rotina diária de coleta. Depois da primeira execução, recarregue esta página. O Catálogo Técnico e o CRM já funcionam.</p>
  <p class="mudo">Detalhe técnico: ${esc(e.message)}</p></div>`;
  $('#hoje').innerHTML = vazio; $('#marcas').innerHTML = vazio;
  renderMais();
}

function renderFrescor() {
  const s = D.saude || {};
  const ok = s.ultima_execucao_ok;
  $('#frescor').innerHTML = `<span class="ponto ${ok === true ? 'ok' : ok === false ? 'falha' : ''}"></span><span>Análise de ${dataHora(D.gerado_em)}${ok === false ? '<br>com falhas de coleta' : ''}</span>`;
}

// ---------- HOJE ----------
const CORES_FAIXA = ['#B5462A','#D9701A','#B7A98A','#7FA35F','#3F7A2E'];
function termometro(ix) {
  const faixas = CORES_FAIXA.map(c => `<i style="background:${c}"></i>`).join('');
  const marc = ix.suficiente ? `<div class="marcador" style="left:${ix.valor}%"><b>${ix.valor}</b></div>` : '';
  return `<div class="termo" role="img" aria-label="${ix.suficiente ? `Índice ${ix.valor} de 100` : 'Índice sem nota'}">${marc}<div class="faixas">${faixas}</div></div>
    <div class="termo-escala"><span>Muito desfavorável</span><span>Neutro</span><span>Muito favorável</span></div>`;
}
function renderHoje() {
  const d = D.diagnostico, g = D.indices.geral;
  const ant = D.anterior;
  const delta = g.valor != null && ant?.geral_valor != null ? g.valor - ant.geral_valor : null;
  let h = planoDoDiaHTML() + alertasCRMHTML() + `<h2>Cenário econômico</h2><div class="veredito">
    <div class="linha1">Diagnóstico de ${dataHora(d.data_analise)} · confiança ${esc(d.confianca)}</div>
    <div class="rec">${esc(cap(d.recomendacao))}</div>
    ${termometro(g)}
    ${g.suficiente
      ? `<div class="linha1" style="margin-top:8px">${esc(g.nome)}: <b>${g.valor}</b> · ${esc(g.classificacao)}${delta != null ? ` · ${delta === 0 ? 'igual à leitura anterior' : (delta > 0 ? '+' : '') + delta + ' vs. ' + dataBR(ant.data)}` : ''}${g.componentes ? ` · agrícola ${g.componentes.agricola ?? '—'}, pecuário ${g.componentes.pecuaria ?? '—'}` : ''}</div>`
      : `<div class="semnota">${esc(g.motivo_confianca)}</div>`}
    <p class="resumo">${esc(d.resumo_executivo)}</p>
  </div>
  <div class="filtros" style="margin-top:12px"><a class="chip" href="#h-plano">O que fazer</a><a class="chip" href="#h-msg">Mensagens</a><a class="chip" href="#h-motivos">Motivos</a></div>`;

  const al = D.alertas || [];
  if (al.length) h += `<h2>Alertas</h2>` + al.map(a => `<div class="alerta"><b>${esc(a.titulo)}</b>${esc(a.detalhe)}</div>`).join('');

  h += oportunidadesHTML();
  h += `<h2 id="h-plano">O que fazer hoje</h2>` + D.plano.slice(0, 3).map(acaoHTML).join('') + `<p><button class="btn" data-ir="plano">Ver plano completo e categorias</button></p>`;
  h += mensagensHTML('h');

  h += `<h2 id="h-motivos">Por que este diagnóstico</h2><div class="fatores">
    <div><h3>O que favorece as vendas</h3>${listaFatores(d.fatores_favoraveis, 'pos')}</div>
    <div><h3>O que dificulta</h3>${listaFatores(d.fatores_desfavoraveis, 'neg')}</div></div>`;
  if (d.contexto_ambiguo?.length) h += d.contexto_ambiguo.filter(c => c.texto).map(c => `<p class="mudo" style="margin-top:12px"><b>Câmbio:</b> ${esc(c.texto)} ${esc(c.nota)}</p>`).join('');
  const mud = [...(d.mudancas_vs_anterior || []), d.tendencia_indice?.texto].filter(Boolean);
  if (mud.length) h += `<h3>O que mudou</h3><ul>${mud.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`;
  if (d.sinais_momento_compra?.length) h += `<h3>Sinais de momento de compra (hipótese)</h3>` + d.sinais_momento_compra.map(x => `<div class="fator" style="margin-bottom:8px"><b>${esc(cap(x.tipo))}.</b> ${esc(x.texto)}<p class="mudo" style="margin:4px 0 0">${esc(x.cuidado)}</p></div>`).join('');
  const fb = store.get('feedback', []).find(x => x.data === D.gerado_em.slice(0, 10));
  h += `<h2>A recomendação de hoje foi útil?</h2><div class="filtros">${['sim', 'em parte', 'não'].map(v => `<button class="chip" data-fb="${v}" aria-pressed="${fb?.util === v}">${v.charAt(0).toUpperCase() + v.slice(1)}</button>`).join('')}</div>
    <p class="mudo">Fica só neste aparelho e ajuda a avaliar, com o tempo, se as recomendações servem na prática. Para registrar contatos e resultados, use o CRM.</p>`;
  h += `<p class="mudo" style="margin:24px 0">${esc(D.metodologia.status)} Critério de confiança: ${esc(d.criterio_confianca)}</p>`;
  $('#hoje').innerHTML = h;
  ligarProdLinks($('#hoje'));
  $('#hoje').querySelectorAll('[data-fb]').forEach(b => b.addEventListener('click', () => {

async function desenhar() {
  const card = D.cards.find(c => c.id === histInd);
  let a = await obs(histInd);
  const b = histComp ? await obs(histComp) : null;
  const fim = a.length ? a[a.length - 1].data : null;
  const corte = histPer && fim ? new Date(Date.parse(fim) - histPer * 864e5).toISOString().slice(0, 10) : '';
  a = a.filter(o => o.data >= corte);
  let bb = b ? b.filter(o => o.data >= corte) : null;
  if (!a.length) { $('#h-graf').innerHTML = '<p class="mudo">Sem observações para este indicador no período.</p>'; return; }
  const base100 = arr => arr.length ? arr.map(o => ({ data: o.data, valor: o.valor / arr[0].valor * 100 })) : arr;
  const s1 = bb ? base100(a) : a, s2 = bb ? base100(bb) : null;
  $('#h-graf').innerHTML = linha(s1, s2, card, bb ? D.cards.find(c => c.id === histComp) : null) +
    `<p class="mudo" style="margin:6px 0 0">${esc(card.fonte)} · ${dataBR(a[0].data)} a ${dataBR(a[a.length-1].data)} · ${a.length} observações (${esc(card.frequencia)}; pontos sem dado não são preenchidos) · última coleta ${dataHora(card.coletado_em)}${bb ? '. Comparação em base 100 no início do período: mostra co-movimento, não causalidade.' : ''}</p>`;
}
function linha(s1, s2, c1, c2) {
  const W = 640, H = 240, P = {l: 46, r: 10, t: 12, b: 26};
  const todas = s1.concat(s2 || []);
  const xs = todas.map(o => Date.parse(o.data)), ys = todas.map(o => o.valor);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * .08 || 1;
  const X = t => P.l + (t - x0) / ((x1 - x0) || 1) * (W - P.l - P.r);
  const Y = v => H - P.b - (v - (y0 - pad)) / ((y1 - y0 + 2 * pad) || 1) * (H - P.t - P.b);
  // quebra a linha quando há lacuna maior que o esperado na frequência (não interpola)
  const gapMax = {diaria: 6, semanal: 14, mensal: 45}[c1.frequencia] || 45;
  const path = s => { let d = '', prev = null; for (const o of s) { const t = Date.parse(o.data); d += `${prev && (t - prev) / 864e5 <= gapMax ? 'L' : 'M'}${X(t).toFixed(1)},${Y(o.valor).toFixed(1)}`; prev = t; } return d; };
  const ticks = [0, .5, 1].map(f => y0 - pad + f * (y1 - y0 + 2 * pad));
  const fmt = v => num(v, Math.abs(v) >= 100 ? 0 : 2);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de ${esc(c1.nome)}">
    ${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--linha)"/><text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--cinza)">${fmt(v)}</text>`).join('')}
    <text x="${P.l}" y="${H - 6}" font-size="11" fill="var(--cinza)">${dataBR(new Date(x0).toISOString())}</text>
    <text x="${W - P.r}" y="${H - 6}" font-size="11" fill="var(--cinza)" text-anchor="end">${dataBR(new Date(x1).toISOString())}</text>
    <path d="${path(s1)}" fill="none" stroke="var(--musgo)" stroke-width="2"/>
    ${s2 ? `<path d="${path(s2)}" fill="none" stroke="var(--laranja)" stroke-width="2"/>` : ''}
  </svg>${s2 ? `<div style="font-size:13px;display:flex;gap:14px;flex-wrap:wrap"><span style="color:var(--musgo)">━ ${esc(c1.nome)}</span><span style="color:var(--laranja)">━ ${esc(c2.nome)}</span></div>` : ''}`;
}

function md(t) {
  const L = t.split('\n'); let h = '', lista = false, tab = [];
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/_\[(.+?)\]_/g, '<span class="etq">$1</span>').replace(/_(.+?)_/g, '<i>$1</i>');
  const fechaTab = () => { if (tab.length) { h += `<div class="rolagem"><table>${tab.filter(r => !/^\|[-| ]+\|$/.test(r)).map((r, i) => `<tr>${r.split('|').slice(1, -1).map(c => i ? `<td>${inl(c.trim())}</td>` : `<th>${inl(c.trim())}</th>`).join('')}</tr>`).join('')}</table></div>`; tab = []; } };
  for (const l of L) {
    if (l.startsWith('|')) { tab.push(l); continue; } else fechaTab();
    const li = /^(- |\d+\. )/.test(l);
    if (!li && lista) { h += '</ul>'; lista = false; }

const NOMEM = { PICCIN: 'Piccin', CRUCIANELLI: 'Crucianelli' };

/** Índices das marcas recalculados com os componentes que dependem do CRM (só existem neste aparelho). */
function indicesComCRM() {
  if (!D?.marcas) return null;
  const regs = crmRegs(), mes = Number((D.gerado_em || hojeISO()).slice(5, 7));
  const out = {};

    comp.crm = crmEvidence(regs, m, hojeISO());

function planoDoDia() {
  const P = D.marcas.plano, I = indicesComCRM(), regs = crmRegs();
  // Prioridade 1 recalculada com o CRM
  let marca = P.prioridade_marca.marca, porque = P.prioridade_marca.porque;
  const vp = I.PICCIN.valor, vc = I.CRUCIANELLI.valor;
  if (vp != null && vc != null && Math.abs(vp - vc) >= 5) {
    const nova = vp > vc ? 'PICCIN' : 'CRUCIANELLI';
    if (nova !== marca || I[nova].componentes.crm.valor != null) { marca = nova; porque = `Índice ${NOMEM[marca]} ${I[marca].valor} × ${NOMEM[marca === 'PICCIN' ? 'CRUCIANELLI' : 'PICCIN']} ${I[marca === 'PICCIN' ? 'CRUCIANELLI' : 'PICCIN'].valor}${I[marca].componentes.crm.valor != null ? ', já considerando as oportunidades do seu CRM' : ''}.`; }
  }
  const eq = P.por_marca[marca].equipamento;
  // Negociação parada da marca do dia primeiro; se não houver, a da outra marca (negociação parada perde força em qualquer marca).
  const paradosTodos = staleNegotiations(regs, hojeISO(), 10);
  const parados = [...paradosTodos.filter(r => r.marca === marca), ...paradosTodos.filter(r => r.marca !== marca)];
  const vencendo = regs.filter(r => r.marca === marca && ABERTAS.includes(r.etapa) && r.proximo_acompanhamento && r.proximo_acompanhamento <= hojeISO());
  const acoes = [];

  return { marca, porque, eq, regiao, clientesEm, perfil: P.perfil_cliente, acoes: acoes.slice(0, 4), arg: P.argumentos, I };
}

    catch (err) { msgCRM(`Importação não concluída: ${esc(err.message)}`, false, true); }
  };
  $('#crm').querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { const n = crm.undoImport(b.dataset.undo); msgCRM(`${n} registro(s) removido(s).`, true); });
  $('#crm').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => formCRM(crm.get(b.dataset.ed)));
  $('#crm').querySelectorAll('[data-int]').forEach(b => b.onclick = () => formInteracao(b.dataset.int, false));
  $('#crm').querySelectorAll('[data-venda]').forEach(b => b.onclick = () => formInteracao(b.dataset.venda, true));
}
function msgCRM(html, ok, jaEscapado = false) { renderCRM(); if (D) { renderMarcas(); renderHoje(); } $('#crm-msg').innerHTML = `<div class="alerta" ${ok ? 'style="border-color:var(--bom)"' : ''}><b>${ok ? 'Feito.' : 'Atenção.'}</b>${jaEscapado ? html : esc(html)}</div>`; }
async function planilhaParaCSV(f) {
  if (/\.xlsx?$/i.test(f.name)) {
    if (!window.XLSX) await new Promise((ok, err) => { const s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; s.onload = ok; s.onerror = () => err(new Error('não foi possível carregar o leitor de Excel (sem internet?) — salve a planilha como CSV')); document.head.appendChild(s); });
    const wb = XLSX.read(await f.arrayBuffer(), { cellDates: true });
    return XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: ';', dateNF: 'yyyy-mm-dd' });
  }
  return f.text();
}
function formCRM(r) {
  const v = r || { marca: crmFiltro.marca || 'PICCIN', etapa: 'prospecção', uf: 'MT' };
  const ops = (lista, val) => lista.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('');
  const eqs = m => PRODUTOS.filter(p => p.fabricante === m).flatMap(p => [p.modelo, ...p.variantes.map(x => x.modelo)]);
  const c = (k, rot, tipo = 'text') => `<label class="mudo">${rot}<br><input id="r-${k}" type="${tipo}" value="${esc(v[k] ?? '')}" style="width:100%"></label>`;
  $('#crm-form').innerHTML = `<div class="ind"><h3 style="margin-top:0">${r ? 'Editar oportunidade' : 'Nova oportunidade'}</h3><div style="display:grid;gap:8px;max-width:560px">
    ${c('cliente', 'Cliente (nome ou apelido)')}${c('revenda', 'Revenda')}
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px">${c('municipio', 'Município')}<label class="mudo">UF<br><select id="r-uf">${ops(['MT', 'RO', 'AC', 'outra'], v.uf)}</select></label></div>
    <label class="mudo">Marca<br><select id="r-marca">${ops(['PICCIN', 'CRUCIANELLI'], v.marca)}</select></label>
    <label class="mudo">Equipamento de interesse (do catálogo)<br><input id="r-equipamento" list="r-eqs" value="${esc(v.equipamento ?? '')}" style="width:100%"><datalist id="r-eqs">${eqs(v.marca).map(m => `<option value="${esc(m)}">`).join('')}</datalist></label>
    <label class="mudo">Perfil<br><select id="r-perfil"><option value="">—</option>${ops(PERFIS, v.perfil)}</select></label>
    <label class="mudo">Etapa<br><select id="r-etapa">${ops(ETAPAS, v.etapa)}</select></label>
    ${c('valor_estimado', 'Valor estimado (R$), se informado')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${c('data_ultimo_contato', 'Último contato', 'date')}${c('proximo_acompanhamento', 'Próximo acompanhamento', 'date')}</div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px">${c('probabilidade', 'Probabilidade (%)', 'number')}${c('probabilidade_justificativa', 'Justificativa (obrigatória se houver %)')}</div>
    <label class="mudo">Observações comerciais<br><textarea id="r-observacoes" rows="3" style="width:100%;font:inherit">${esc(v.observacoes ?? '')}</textarea></label>
    <p><button class="btn cheio" id="r-salva">Salvar</button> ${r ? `<button class="btn" id="r-del">Excluir</button>` : ''}</p></div><div id="r-msg"></div></div>`;
  $('#r-marca').onchange = e => { $('#r-eqs').innerHTML = eqs(e.target.value).map(m => `<option value="${esc(m)}">`).join(''); };
  $('#r-salva').onclick = () => {
    const g = k => $('#r-' + k).value;
    const dados = Object.fromEntries(['cliente', 'revenda', 'municipio', 'uf', 'marca', 'equipamento', 'perfil', 'etapa', 'valor_estimado', 'data_ultimo_contato', 'proximo_acompanhamento', 'probabilidade', 'probabilidade_justificativa', 'observacoes'].map(k => [k, g(k)]));
    if (dados.uf === 'outra') dados.uf = '';
    const res = r ? crm.update(r.id, dados) : crm.add(dados);
    if (!res.ok) { $('#r-msg').innerHTML = `<div class="alerta"><b>Não salvo</b>${res.erros.map(esc).join('<br>')}</div>`; return; }
    msgCRM(`Oportunidade salva.${res.avisos?.length ? ' ' + res.avisos.join(' ') : ''}`, true);
  };
  if (r) $('#r-del').onclick = () => { if (confirm(`Excluir a oportunidade de ${r.cliente}?`)) { crm.remove(r.id); msgCRM('Oportunidade excluída.', true); } };
  $('#crm-form').scrollIntoView({ block: 'start' });
}
function formInteracao(id, venda) {
  const r = crm.get(id);
  $('#crm-form').innerHTML = `<div class="ind"><h3 style="margin-top:0">${venda ? 'Registrar venda' : 'Registrar contato, visita ou proposta'} — ${esc(r.cliente)}</h3><div style="display:grid;gap:8px;max-width:420px">
    ${venda ? '' : `<label class="mudo">Tipo<br><select id="i-tipo"><option>contato</option><option>visita</option><option>proposta</option></select></label>`}
    <label class="mudo">Data<br><input id="i-data" type="date" value="${hojeISO()}"></label>
    <label class="mudo">Valor (R$), se houver<br><input id="i-valor" inputmode="decimal"></label>
    <label class="mudo">Nota<br><input id="i-nota" style="width:100%"></label>
    <p><button class="btn cheio" id="i-salva">Salvar</button></p></div></div>`;
  $('#i-salva').onclick = () => {
    const valor = $('#i-valor').value.trim() ? Number($('#i-valor').value.replace(/\./g, '').replace(',', '.')) : null;
    const res = venda ? crm.registerSale(id, { data: $('#i-data').value, valor, nota: $('#i-nota').value }) : crm.addInteraction(id, { tipo: $('#i-tipo').value, data: $('#i-data').value, valor, nota: $('#i-nota').value });
    msgCRM(res.ok ? (venda ? 'Venda registrada.' : 'Registro salvo; último contato atualizado.') : res.erros.join('; '), res.ok);
  };
}

// ================== REGIONAL (mapa SVG sem bibliotecas) ==================
let regMarca = 'CRUCIANELLI', regSel = null;
async function renderRegional() {
  const el = $('#regional');
  el.innerHTML = '<h2>Inteligência regional</h2><p class="mudo">Carregando…</p>';
  if (!POT) { try { POT = await getJSON('data/regional/potencial.json'); } catch { POT = null; } }
  if (!GEO.length) for (const uf of ['51', '11', '12']) { try { GEO.push(...(await getJSON(`data/geo/uf-${uf}.json`)).features); } catch {} }
  if (!POT?.disponivel) {
    el.innerHTML = `<h2>Inteligência regional</h2><div class="alerta"><b>Dados municipais ainda não coletados</b>${esc(POT?.motivo || 'A coleta do IBGE (área plantada por município e rebanho) roda no agendador da nuvem, no máximo uma vez por mês.')}</div>
      <p>Enquanto isso, o plano do dia indica regiões pelo perfil produtivo conhecido. Clientes do CRM por município:</p>${listaCRMMunicipios()}`;
    return;
  }
  const k = regMarca === 'CRUCIANELLI' ? 'potencial_crucianelli' : 'potencial_piccin';
  const porCod = Object.fromEntries(POT.municipios.map(m => [m.codigo, m]));
  const regs = crmRegs();
  const crmPorMun = {}; for (const r of regs) { const m = POT.municipios.find(x => norm(x.nome) === norm(r.municipio) && (!r.uf || x.uf === r.uf)); if (m) (crmPorMun[m.codigo] ||= []).push(r); }
  el.innerHTML = `<h2>Inteligência regional</h2>
    <div class="filtros">${['CRUCIANELLI', 'PICCIN'].map(m => `<button class="chip" data-rm="${m}" aria-pressed="${m === regMarca}">Potencial ${NOMEM[m]}</button>`).join('')}</div>
    <div class="grafico">${GEO.length ? mapaSVG(porCod, k, crmPorMun) : '<p class="mudo">Malha municipal não disponível — veja a lista abaixo.</p>'}
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:6px">${[['#EEF2EA', 'sem dado'], ['#C9DDB8', '0–39'], ['#9CC27E', '40–59'], ['#6F9A4E', '60–79'], ['#3F5A2E', '80–100']].map(([c, t]) => `<span><i style="display:inline-block;width:12px;height:12px;background:${c};border:1px solid var(--linha);vertical-align:-2px"></i> ${t}</span>`).join('')}<span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--laranja);vertical-align:-1px"></i> cliente/oportunidade no CRM</span></div></div>
    <div id="reg-info">${regSel ? infoMunicipio(porCod[regSel], crmPorMun[regSel]) : '<p class="mudo">Toque num município para ver os dados.</p>'}</div>
    <p class="mudo">${esc(POT.aviso)} ${esc(POT.metodo)} Fontes: ${esc(POT.fontes.join('; '))} (PAM ${POT.ano_pam}, PPM ${POT.ano_ppm ?? '—'}).</p>
    <h3>Municípios prioritários — ${NOMEM[regMarca]}</h3>
    <div class="rolagem"><table><tr><th>Município</th><th>Potencial</th><th>Soja</th><th>Milho</th><th>Algodão</th><th>Café</th><th>Bovinos</th><th>CRM</th></tr>
    ${POT.municipios.filter(m => m[k] != null).sort((a, b) => b[k] - a[k]).slice(0, 25).map(m => `<tr><td>${esc(m.nome)} (${m.uf})</td><td>${m[k]}</td><td>${m.soja_ha != null ? num(m.soja_ha, 0) : '—'}</td><td>${m.milho_ha != null ? num(m.milho_ha, 0) : '—'}</td><td>${m.algodao_ha != null ? num(m.algodao_ha, 0) : '—'}</td><td>${m.cafe_ha != null ? num(m.cafe_ha, 0) : '—'}</td><td>${m.bovinos_cab != null ? num(m.bovinos_cab, 0) : '—'}</td><td>${crmPorMun[m.codigo]?.length || '—'}</td></tr>`).join('')}</table></div>
    <p class="mudo">Áreas em hectares (área plantada); bovinos em cabeças. Município com forte atividade agrícola ≠ oportunidade comprovada: oportunidade comprovada é a que está no CRM (pontos laranja).</p>`;
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { regMarca = b.dataset.rm; renderRegional(); });
  el.querySelectorAll('[data-mun]').forEach(pth => pth.addEventListener('click', () => { regSel = pth.dataset.mun; $('#reg-info').innerHTML = infoMunicipio(porCod[regSel], crmPorMun[regSel]); }));
}
function listaCRMMunicipios() {
  const g = {}; for (const r of crmRegs()) if (r.municipio) (g[`${r.municipio}${r.uf ? '/' + r.uf : ''}`] ||= []).push(r);
  const e = Object.entries(g); return e.length ? `<ul>${e.map(([m, rs]) => `<li>${esc(m)}: ${rs.length} oportunidade(s) — ${[...new Set(rs.map(r => NOMEM[r.marca]))].join(', ')}</li>`).join('')}</ul>` : '<p class="mudo">Nenhum cliente com município no CRM.</p>';
}
function infoMunicipio(m, rs) {
  if (!m) return '';
  return `<div class="ind"><div class="nome">${esc(m.nome)} (${m.uf})</div><div style="font-size:14px">Potencial Crucianelli: <b>${m.potencial_crucianelli ?? '—'}</b> · Piccin: <b>${m.potencial_piccin ?? '—'}</b><br>
    Soja ${m.soja_ha != null ? num(m.soja_ha, 0) + ' ha' : '—'} · Milho ${m.milho_ha != null ? num(m.milho_ha, 0) + ' ha' : '—'} · Algodão ${m.algodao_ha != null ? num(m.algodao_ha, 0) + ' ha' : '—'} · Café ${m.cafe_ha != null ? num(m.cafe_ha, 0) + ' ha' : '—'} · Bovinos ${m.bovinos_cab != null ? num(m.bovinos_cab, 0) : '—'}</div>
    ${rs?.length ? `<p style="margin:6px 0 0"><b>No CRM:</b> ${rs.map(r => `${esc(r.cliente)} (${NOMEM[r.marca]}, ${esc(r.etapa)})`).join('; ')}</p>` : '<p class="mudo" style="margin:6px 0 0">Nenhuma oportunidade registrada neste município.</p>'}</div>`;
}
function mapaSVG(porCod, k, crmPorMun) {
  const W = 640, H = 560; let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  const anel = f => f.geometry.type === 'Polygon' ? f.geometry.coordinates : f.geometry.coordinates.flat();
  for (const f of GEO) for (const r of anel(f)) for (const [x, y] of r) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  const kx = Math.cos((minY + maxY) / 2 * Math.PI / 180), sx = (maxX - minX) * kx, sy = maxY - minY;
  const esc_ = Math.min((W - 10) / sx, (H - 10) / sy);
  const P = ([x, y]) => [5 + (x - minX) * kx * esc_, 5 + (maxY - y) * esc_];
  const cor = v => v == null ? '#EEF2EA' : v >= 80 ? '#3F5A2E' : v >= 60 ? '#6F9A4E' : v >= 40 ? '#9CC27E' : '#C9DDB8';
  let paths = '', pts = '';
  for (const f of GEO) {
    const cod = f.properties.codarea, m = porCod[cod];
    const d = anel(f).map(r => 'M' + r.map(c => P(c).map(n => n.toFixed(1)).join(',')).join('L') + 'Z').join('');
    paths += `<path d="${d}" fill="${cor(m?.[k])}" stroke="var(--papel)" stroke-width="0.6" data-mun="${esc(cod)}" style="cursor:pointer"><title>${esc(m?.nome || cod)}: ${m?.[k] ?? 'sem dado'}</title></path>`;
    if (crmPorMun[cod]) { const r0 = anel(f)[0]; const c = r0.reduce((a, p) => [a[0] + p[0] / r0.length, a[1] + p[1] / r0.length], [0, 0]); const [x, y] = P(c); pts += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="var(--laranja)" stroke="#fff" stroke-width="1.5"><title>${crmPorMun[cod].length} no CRM</title></circle>`; }
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mapa de potencial por município">${paths}${pts}</svg>`;
}

const t0 = store.get('tema', 'auto'); if (t0 !== 'auto') document.documentElement.dataset.theme = t0;

carregar();
</script>
